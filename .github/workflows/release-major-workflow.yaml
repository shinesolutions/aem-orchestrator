---
name: Release Major
on: [workflow_dispatch]
# GITHUB_TOKEN is read-only; workflows that write to the repository use
# SHINEOPENSOURCE_GITHUB_TOKEN instead
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: cliffano/release-action@v2.2.0
        with:
          release_type: major
          github_token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
          git_user_email: opensource@shinesolutions.com
          git_user_name: Shine Solutions
