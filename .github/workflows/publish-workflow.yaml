---
name: Publish to Maven Central
'on':
  push:
    tags:
      - 'aem-orchestrator-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    container: shinesolutions/aem-platform-buildenv:6.3.0
    steps:
      - uses: actions/checkout@v7
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SHINEOPENSOURCE_MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.SHINEOPENSOURCE_MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_PASSPHRASE }}
        run: make publish
